<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0.75" y2="1">
      <stop stop-color="#b8b8b8"/>
      <stop offset="0.35" stop-color="#686868"/>
      <stop offset="0.62" stop-color="#929292"/>
      <stop offset="1" stop-color="#343434"/>
    </linearGradient>
    <filter id="relief" x="-25%" y="-20%" width="155%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
      <feSpecularLighting in="height" surfaceScale="5" specularConstant="0.7" specularExponent="24" lighting-color="#ffffff" result="shine">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="shine" in2="SourceAlpha" operator="in" result="clipped-shine"/>
      <feComposite in="SourceGraphic" in2="clipped-shine" operator="arithmetic" k2="1" k3="0.45" result="lit"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="shadow-blur"/>
      <feOffset in="shadow-blur" dx="2" dy="4" result="shadow-offset"/>
      <feComponentTransfer in="shadow-offset" result="shadow">
        <feFuncA type="linear" slope="0.65"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#relief)">
  <g fill="none" stroke="url(#silver)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="150" r="76"/>
    <circle cx="128" cy="150" r="21"/>
    <path d="m61 114 49 26m85-26-49 26m-18 31v55"/>
  </g>
  <path fill="url(#silver)" d="M138 147V28Q138 18 148 18T158 28c0 19 53 13 70 44 16 28 3 49-14 65 12-22 10-44-10-56-16-10-34-10-53-16v82z"/>
  <ellipse fill="url(#silver)" cx="128" cy="150" rx="24" ry="17" transform="rotate(-20 128 150)"/>
  </g>
</svg>
